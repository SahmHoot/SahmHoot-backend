spring:
  application:
    name: sahmhoot
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sahmhoot?characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:sahmhoot_user}
    password: ${DB_PASSWORD:sahmhoot1!}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

  mail:
    # 비워 두면 메일 대신 서버 로그에 인증 코드를 찍는다(로컬 개발용)
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    # 32바이트 이상. 비워 두면 실행할 때마다 임시 키(로컬 전용). 운영은 환경변수 JWT_SECRET 필수
    secret: ${JWT_SECRET:}
    expiration-days: 14
  mail:
    from: ${MAIL_FROM:no-reply@sahmhoot.local}
  auth:
    # 쉼표로 구분(예: syuin.ac.kr). 비우면 도메인 제한 없음
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:}
  cors:
    # REST CORS와 WebSocket 허용 origin. 운영은 실제 도메인만
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080

# API 문서(NFR-12). 기본은 비공개, local 프로파일에서만 /swagger-ui.html·/v3/api-docs를 연다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
