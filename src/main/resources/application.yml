spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: sahmhoot
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sahmhoot?characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:sahmhoot_user}
    password: ${DB_PASSWORD:sahmhoot1!}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

  mail:
    # 로컬은 SSH 포워딩, 운영은 같은 VM의 Postfix에 연결한다.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:false}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

app:
  jwt:
    # 32바이트 이상. 비워 두면 실행할 때마다 임시 키(로컬 전용). 운영은 환경변수 JWT_SECRET 필수
    secret: ${JWT_SECRET:}
    expiration-days: 14
  mail:
    from: ${MAIL_FROM:}
  auth:
    # 쉼표로 구분(예: syuin.ac.kr). 비우면 도메인 제한 없음
    allowed-email-domains: ${ALLOWED_EMAIL_DOMAINS:}
  room:
    # 학생 입장 주소의 프론트엔드 URL. 배포 시 공개 주소로 설정
    join-base-url: ${APP_ROOM_JOIN_BASE_URL:http://localhost:5173}
  cors:
    # REST CORS와 WebSocket 허용 origin. 운영은 실제 도메인만
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080

# API 문서(NFR-12). 기본은 비공개, local 프로파일에서만 /swagger-ui.html·/v3/api-docs를 연다
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: local
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
