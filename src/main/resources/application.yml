spring:
  application:
    name: sahmhoot
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sahmhoot?characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:sahmhoot}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-days: 14
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

server:
  port: 8080
