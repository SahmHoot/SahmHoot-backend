spring:
  application:
    name: sahmhoot
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sahmhoot?characterEncoding=UTF-8&connectionTimeZone=UTC}
    username: ${DB_USERNAME:sahmhoot}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

# TODO(3): app.jwt.* (secret, expiration-days)
# TODO(1): app.cors.allowed-origins (WebSocket 허용 origin)

server:
  port: 8080
