# 서버 /etc/nginx/sites-available/sahmhoot 사본(DEPLOY.md 2026-11-15 기준).
# 서버 파일을 바꾸면 이 파일도 같이 고친다. 인증서는 경로만 있고 개인키 내용은 레포에 두지 않는다.

server {
    server_name sahmhoot.com www.sahmhoot.com;

    root /var/www/sahmhoot;
    index index.html;

    # React 프론트엔드
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Question-image upload request limit
    location ~ ^/api/question-sets/[0-9]+/images$ {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 실시간 퀴즈 WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sahmhoot.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sahmhoot.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.sahmhoot.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sahmhoot.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sahmhoot.com www.sahmhoot.com;
    return 404; # managed by Certbot
}
