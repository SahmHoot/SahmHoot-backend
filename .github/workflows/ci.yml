name: Backend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# 같은 PR에 커밋이 연달아 올라오면 이전 실행은 취소한다
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 테스트가 접속하는 값(application.yml, application-test.yml의 기본값)과 같게 맞춘다.
    # 로컬 개발용으로 저장소에 이미 공개된 값이며 CI 컨테이너는 실행이 끝나면 사라진다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sahmhoot_test
          MYSQL_USER: sahmhoot_user
          MYSQL_PASSWORD: sahmhoot1!
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: 빌드·테스트
        run: ./gradlew build

      # 실패했을 때만 원인을 볼 수 있게 테스트 리포트를 남긴다
      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
